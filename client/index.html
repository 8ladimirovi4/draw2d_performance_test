<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>draw2d — загрузка схемы (JSON)</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/jquery-ui/jquery-ui.min.js"></script>
  <script src="/vendor/draw2d/draw2d.js"></script>
  <script src="/js/schema-loader.js"></script>
  <script src="/js/schema-interactive-bindings.js"></script>
  <script src="/js/app.js"></script>
</head>
<body style="width:4000px; height:4000px;">
  <div class="toolbar" >
    <label>
      Фикстура (query <code>?fixture=</code>):
      <strong id="fixture-hint">sample</strong>
    </label>
    <span id="status"></span>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      document.getElementById('fixture-hint').textContent = p.get('fixture') || 'sample';
    })();
  </script>
  <div class="canvas-viewport"  id="canvas-viewport">
    <div id="gfx_holder"></div>
  </div>
</body>
</html>
