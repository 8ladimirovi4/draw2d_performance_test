<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>draw2d — загрузка схемы (JSON)</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <!-- draw2d: официальная сборка freegroup/draw2d (pin версии для воспроизводимости) -->
  <script src="https://cdn.jsdelivr.net/gh/freegroup/draw2d@v6.6.4/dist/draw2d.js"></script>
  <script src="/js/schema-loader.js"></script>
  <script src="/js/schema-interactive-bindings.js"></script>
  <script src="/js/app.js"></script>
</head>
<body>
  <div class="toolbar">
    <label>
      Фикстура (query <code>?fixture=</code>):
      <strong id="fixture-hint">sample</strong>
    </label>
    <span id="status"></span>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      document.getElementById('fixture-hint').textContent = p.get('fixture') || 'sample';
    })();
  </script>
  <div class="canvas-viewport" id="canvas-viewport">
    <div id="gfx_holder" onselectstart="javascript:/* IE8 hack */return false"></div>
  </div>
</body>
</html>
